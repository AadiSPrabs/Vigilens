<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#e8f4ea"/>
  <!-- Ground -->
  <rect y="500" width="1280" height="220" fill="#8b7355"/>
  <!-- Crane structure on left -->
  <rect x="50" y="200" width="20" height="300" fill="#666"/>
  <rect x="30" y="180" width="60" height="20" fill="#666"/>
  <line x1="60" y1="180" x2="200" y2="100" stroke="#666" stroke-width="10"/>
  <!-- Person 1 - fully equipped worker (in safe zone area) -->
  <ellipse cx="400" cy="520" rx="30" ry="35" fill="#d4a574"/>
  <rect x="375" y="555" width="50" height="80" rx="10" fill="#2563eb"/>
  <rect x="370" y="560" width="15" height="40" rx="5" fill="#2563eb"/>
  <rect x="440" y="560" width="15" height="40" rx="5" fill="#2563eb"/>
  <rect x="380" y="635" width="18" height="35" rx="5" fill="#333"/>
  <rect x="412" y="635" width="18" height="35" rx="5" fill="#333"/>
  <!-- Hard hat -->
  <ellipse cx="400" cy="490" rx="28" ry="18" fill="#fbbf24"/>
  <rect x="372" y="490" width="56" height="8" rx="4" fill="#fbbf24"/>
  <!-- High vis vest -->
  <rect x="375" y="555" width="50" height="60" rx="8" fill="#f59e0b" opacity="0.9"/>
  <rect x="375" y="555" width="50" height="15" rx="8" fill="#fbbf24"/>
  <!-- Person 2 - another fully equipped worker -->
  <ellipse cx="800" cy="530" rx="28" ry="33" fill="#c68642"/>
  <rect x="778" y="563" width="44" height="75" rx="10" fill="#16a34a"/>
  <rect x="774" y="568" width="14" height="38" rx="5" fill="#16a34a"/>
  <rect x="832" y="568" width="14" height="38" rx="5" fill="#16a34a"/>
  <rect x="782" y="638" width="16" height="32" rx="5" fill="#333"/>
  <rect x="810" y="638" width="16" height="32" rx="5" fill="#333"/>
  <ellipse cx="800" cy="500" rx="26" ry="16" fill="#fbbf24"/>
  <rect x="774" y="500" width="52" height="7" rx="3.5" fill="#fbbf24"/>
  <rect x="778" y="563" width="44" height="56" rx="8" fill="#f59e0b" opacity="0.9"/>
  <rect x="778" y="563" width="44" height="14" rx="8" fill="#fbbf24"/>
  <text x="640" y="60" font-family="Arial, sans-serif" font-size="32" fill="#1e3a8a" text-anchor="middle">Vigilens Sample 1 - Equipped Site</text>
</svg>
